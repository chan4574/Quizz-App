<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Maker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1B2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0b0d12;
    --paper-line:#242936;
    --ink:#f2f4f8;
    --ink-soft:#9aa4b5;
    --pencil:#8b7cff;
    --amber:#f5b84b;
    --green:#4fd18b;
    --red:#ff6577;
    --card:#131720;
    --card-2:#171c27;
    --glow:rgba(139,124,255,.20);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(139,124,255,.12), transparent 28%),
      radial-gradient(circle at 90% 20%, rgba(79,209,139,.06), transparent 24%),
      var(--paper);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    min-height:100vh;
    padding:24px 16px 60px;
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px);
    background-size:100% 32px; opacity:.35;
  }
  .wrap{max-width:680px;margin:0 auto;position:relative;}
  header.app-header{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--paper-line);
    padding:14px 2px 14px; margin-bottom:22px;
  }
  header.app-header h1{
    font-family:'Space Mono',monospace; font-size:1.1rem;
    letter-spacing:.08em; text-transform:uppercase; margin:0;
    font-weight:700; color:#fff;
  }
  header.app-header .tag{
    font-family:'Space Mono',monospace; font-size:.68rem;
    color:var(--pencil);
  }
  .card{
    background:linear-gradient(145deg,var(--card),#10141c);
    border:1px solid var(--paper-line);
    border-radius:14px;
    box-shadow:0 12px 35px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.025);
    padding:20px 20px 22px; margin-bottom:16px;
  }
  .field{margin-bottom:14px;}
  label{
    display:block; font-family:'Space Mono',monospace; font-size:.68rem;
    text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft);
    margin-bottom:7px;
  }
  textarea,input[type=text],input[type=number],select{
    width:100%; font-family:'Source Serif 4',Georgia,serif; font-size:.98rem;
    padding:12px 13px; border:1px solid var(--paper-line); border-radius:10px;
    background:#0e1219; color:var(--ink); outline:none;
    transition:border-color .18s,box-shadow .18s;
  }
  textarea:focus,input[type=text]:focus,input[type=number]:focus,select:focus{
    border-color:var(--pencil); box-shadow:0 0 0 3px var(--glow);
  }
  textarea{min-height:110px;resize:vertical;}
  input[type=file]{font-family:'Space Mono',monospace;font-size:.75rem;color:var(--ink-soft);}
  .tabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;}
  .tab-btn{
    font-family:'Space Mono',monospace;font-size:.68rem;text-transform:uppercase;
    letter-spacing:.05em;padding:8px 13px;border:1px solid var(--paper-line);
    background:#10141c;color:var(--ink-soft);border-radius:999px;cursor:pointer;
    transition:.18s;
  }
  .tab-btn:hover{border-color:#4b5263;color:var(--ink);}
  .tab-btn.active{background:var(--pencil);color:#fff;border-color:var(--pencil);box-shadow:0 6px 18px var(--glow);}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row .field{flex:1;min-width:140px;}
  .mode-toggle{display:flex;border:1px solid var(--paper-line);border-radius:10px;overflow:hidden;background:#0e1219;}
  .mode-toggle button{
    flex:1;padding:10px;font-family:'Space Mono',monospace;font-size:.7rem;
    text-transform:uppercase;letter-spacing:.04em;border:none;background:transparent;
    color:var(--ink-soft);cursor:pointer;
  }
  .mode-toggle button.active{background:var(--pencil);color:#fff;}
  .btn{
    font-family:'Space Mono',monospace;font-size:.74rem;text-transform:uppercase;
    letter-spacing:.05em;padding:12px 18px;border-radius:10px;border:1px solid transparent;
    cursor:pointer;font-weight:700;transition:transform .15s,box-shadow .15s,background .15s;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:linear-gradient(135deg,#8b7cff,#6f61ed);color:#fff;width:100%;box-shadow:0 8px 24px var(--glow);}
  .btn-primary:disabled{background:#343947;color:#777;cursor:not-allowed;box-shadow:none;}
  .btn-amber{background:var(--amber);color:#17120a;box-shadow:0 7px 20px rgba(245,184,75,.14);}
  .btn-outline{background:#111620;color:var(--ink);border:1px solid #3a4252;}
  .btn-outline:hover{border-color:var(--pencil);box-shadow:0 6px 18px var(--glow);}
  .btn-row{display:flex;gap:10px;margin-top:6px;}
  .btn-row .btn{flex:1;}
  .hint{font-size:.78rem;color:var(--ink-soft);margin-top:6px;line-height:1.4;}
  .error-box{background:rgba(255,101,119,.09);border:1px solid var(--red);color:#ff9aa7;padding:10px 12px;border-radius:9px;font-size:.85rem;margin-bottom:12px;}
  .progress-line{
    font-family:'Space Mono',monospace;font-size:.7rem;color:var(--ink-soft);
    display:flex;justify-content:space-between;margin-bottom:8px;
  }
  .progress-track{height:6px;background:#252b37;border-radius:99px;margin-bottom:20px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,#6f61ed,#a89fff);border-radius:99px;transition:width .25s ease;box-shadow:0 0 12px var(--glow);}
  .q-number{font-family:'Space Mono',monospace;font-size:.72rem;color:var(--pencil);letter-spacing:.06em;margin-bottom:6px;}
  .q-text{font-size:1.18rem;line-height:1.5;margin:0 0 18px;color:#f7f8fb;}
  .option{
    display:flex;align-items:center;gap:12px;padding:13px 14px;
    border:1px solid #2b3240;border-radius:11px;margin-bottom:9px;
    cursor:pointer;background:#10151e;transition:.16s;
  }
  .option:hover{border-color:#6358b8;background:#151a26;transform:translateX(2px);}
  .bubble{flex:0 0 20px;width:20px;height:20px;border-radius:50%;border:2px solid #596274;position:relative;}
  .option.selected .bubble{border-color:var(--pencil);}
  .option.selected .bubble::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--pencil);box-shadow:0 0 8px var(--glow);}
  .option.locked{cursor:default;}
  .option.correct{border-color:var(--green);background:rgba(79,209,139,.08);}
  .option.correct .bubble{border-color:var(--green);}
  .option.correct .bubble::after{background:var(--green);}
  .option.incorrect{border-color:var(--red);background:rgba(255,101,119,.08);}
  .option.incorrect .bubble{border-color:var(--red);}
  .option.incorrect .bubble::after{background:var(--red);}
  .option-text{font-size:.98rem;}
  .feedback{font-family:'Space Mono',monospace;font-size:.76rem;padding:10px 12px;border-radius:9px;margin:10px 0;letter-spacing:.02em;}
  .feedback.ok{background:rgba(79,209,139,.09);color:var(--green);}
  .feedback.no{background:rgba(255,101,119,.09);color:#ff8b99;}
  .explanation{font-size:.9rem;color:var(--ink-soft);line-height:1.5;margin-top:6px;}
  .stamp{display:inline-block;border:3px solid var(--red);color:var(--red);font-family:'Space Mono',monospace;font-weight:700;font-size:1.6rem;padding:10px 22px;transform:rotate(-3deg);border-radius:8px;letter-spacing:.05em;margin-bottom:6px;}
  .stamp.pass{border-color:var(--green);color:var(--green);}
  .score-sub{font-family:'Space Mono',monospace;font-size:.78rem;color:var(--ink-soft);}
  .review-item{border-top:1px solid var(--paper-line);padding:14px 0;}
  .review-item:first-child{border-top:none;}
  .review-q{font-size:1rem;margin:0 0 8px;font-weight:600;}
  .review-ans{font-size:.88rem;margin:2px 0;}
  .review-ans.you-wrong{color:var(--red);}
  .review-ans.you-right{color:var(--green);}
  .review-ans.correct-line{color:var(--green);}
  .link-btn{background:none;border:none;color:var(--pencil);font-family:'Space Mono',monospace;font-size:.72rem;text-decoration:underline;cursor:pointer;padding:0;}
  .center{text-align:center;}
  .manual-list{margin-top:10px;}
  .manual-q{border:1px solid #2b3240;border-radius:10px;padding:11px;margin-bottom:8px;font-size:.85rem;display:flex;justify-content:space-between;gap:8px;background:#10151e;}
  .manual-q button{background:none;border:none;color:var(--red);cursor:pointer;font-family:'Space Mono',monospace;font-size:.7rem;}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .qnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
  .qnav-item{
    width:30px;height:30px;border-radius:8px;border:1px solid var(--paper-line);
    background:#10141c;color:var(--ink-soft);font-family:'Space Mono',monospace;
    font-size:.7rem;display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex:0 0 auto;
  }
  .qnav-item.current{border-color:var(--pencil);box-shadow:0 0 0 2px var(--glow);color:#fff;}
  .qnav-item.done{background:var(--pencil);color:#fff;border-color:var(--pencil);}
  .qnav-item.done.current{background:linear-gradient(135deg,#8b7cff,#6f61ed);}
  .top-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .top-actions .btn{padding:7px 10px;font-size:.68rem;}
  .resume-card{border:1px solid var(--pencil);box-shadow:0 0 0 3px var(--glow);}
  .review-ans.skipped{color:var(--ink-soft);font-style:italic;}
  .finish-link{display:block;text-align:center;margin-top:12px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const AppState = {
  phase: 'setup', // setup | manual | quiz | results
  mode: 'practice', // practice | exam
  setupTab: 'paste', // paste | file | topic
  pastedText: '',
  fileText: '',
  fileName: '',
  topic: '',
  numQuestions: 6,
  loading: false,
  error: '',
  questions: [], // {question, options:[4], correctIndex, explanation}
  manualDraft: {question:'', options:['','','',''], correctIndex:0},
  current: 0,
  selected: {}, // index -> chosen option index
  confirmed: {}, // index -> bool
  score: 0,
  readyText: '',
  savedQuizId: null,
  savedQuizName: '',
};

/* ---------------- SAVED QUIZZES (LOCAL OFFLINE STORAGE) ---------------- */
const SAVED_QUIZZES_KEY = 'quiz-maker-saved-quizzes-v1';

function getSavedQuizzes(){
  try{
    const data = JSON.parse(localStorage.getItem(SAVED_QUIZZES_KEY) || '[]');
    return Array.isArray(data) ? data : [];
  }catch(e){
    return [];
  }
}

function saveCurrentQuiz(){
  if(!AppState.questions.length) return;

  const existing = getSavedQuizzes();
  const existingItem = AppState.savedQuizId
    ? existing.find(x => x.id === AppState.savedQuizId)
    : null;

  const defaultName = existingItem?.name || 'Ready-made quiz ' +
    new Date().toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'});
  const name = prompt('Name this quiz:', defaultName);
  if(name === null) return;

  const cleanName = name.trim() || defaultName;
  const id = AppState.savedQuizId || (Date.now().toString(36) + Math.random().toString(36).slice(2,8));

  const item = {
    id,
    name: cleanName,
    questions: JSON.parse(JSON.stringify(AppState.questions)),
    savedAt: new Date().toISOString()
  };

  const index = existing.findIndex(x => x.id === id);
  if(index >= 0) existing[index] = item;
  else existing.unshift(item);

  try{
    localStorage.setItem(SAVED_QUIZZES_KEY, JSON.stringify(existing));
    AppState.savedQuizId = id;
    AppState.savedQuizName = cleanName;
    AppState.error = '';
    render();
  }catch(e){
    AppState.error = 'Could not save this quiz on this device. Your browser storage may be full or disabled.';
    render();
  }
}

function loadSavedQuiz(id){
  const item = getSavedQuizzes().find(x => x.id === id);
  if(!item) return;

  AppState.questions = JSON.parse(JSON.stringify(item.questions));
  AppState.savedQuizId = item.id;
  AppState.savedQuizName = item.name;
  AppState.phase = 'quiz';
  AppState.error = '';
  startQuiz();
}

function deleteSavedQuiz(id){
  const item = getSavedQuizzes().find(x => x.id === id);
  if(!item) return;
  if(!confirm('Delete "' + item.name + '" from this device?')) return;

  const remaining = getSavedQuizzes().filter(x => x.id !== id);
  localStorage.setItem(SAVED_QUIZZES_KEY, JSON.stringify(remaining));

  if(AppState.savedQuizId === id){
    AppState.savedQuizId = null;
    AppState.savedQuizName = '';
  }
  render();
}

function buildSavedQuizzes(){
  const saved = getSavedQuizzes();
  if(!saved.length) return null;

  const card = el('div','card');
  card.appendChild(el('label',null,'Saved quizzes — available offline'));

  saved.forEach(item => {
    const row = el('div','manual-q');
    const info = el('span',null,
      '<strong>' + escapeHtml(item.name) + '</strong><br>' +
      '<span class="hint">' + item.questions.length + ' question(s)</span>');
    const actions = el('div');
    actions.style.display = 'flex';
    actions.style.gap = '8px';

    const open = el('button','btn btn-outline','Open');
    open.style.padding = '7px 10px';
    open.onclick = () => loadSavedQuiz(item.id);

    const del = el('button','btn btn-outline','Delete');
    del.style.padding = '7px 10px';
    del.style.color = 'var(--red)';
    del.onclick = () => deleteSavedQuiz(item.id);

    actions.appendChild(open);
    actions.appendChild(del);
    row.appendChild(info);
    row.appendChild(actions);
    card.appendChild(row);
  });

  return card;
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

/* ---------------- IN-PROGRESS QUIZ (AUTO-SAVED, RESUMABLE) ---------------- */
const PROGRESS_KEY = 'quiz-maker-progress-v1';

function saveProgress(){
  try{
    localStorage.setItem(PROGRESS_KEY, JSON.stringify({
      questions: AppState.questions,
      mode: AppState.mode,
      current: AppState.current,
      selected: AppState.selected,
      confirmed: AppState.confirmed,
      score: AppState.score,
      savedQuizId: AppState.savedQuizId,
      savedQuizName: AppState.savedQuizName,
      updatedAt: new Date().toISOString()
    }));
  }catch(e){ /* storage unavailable — quiz still works, just won't resume after a restart */ }
}

function getProgress(){
  try{
    const data = JSON.parse(localStorage.getItem(PROGRESS_KEY));
    return (data && Array.isArray(data.questions) && data.questions.length) ? data : null;
  }catch(e){
    return null;
  }
}

function clearProgress(){
  try{ localStorage.removeItem(PROGRESS_KEY); }catch(e){}
}

function resumeProgress(){
  const p = getProgress();
  if(!p) return;
  AppState.questions = p.questions;
  AppState.mode = p.mode || 'practice';
  AppState.current = p.current || 0;
  AppState.selected = p.selected || {};
  AppState.confirmed = p.confirmed || {};
  AppState.score = p.score || 0;
  AppState.savedQuizId = p.savedQuizId || null;
  AppState.savedQuizName = p.savedQuizName || '';
  AppState.phase = 'quiz';
  AppState.error = '';
  render();
}

function buildResumeCard(){
  const p = getProgress();
  if(!p) return null;
  const total = p.questions.length;
  const answered = Object.keys(p.confirmed || {}).length;
  const card = el('div','card resume-card');
  card.appendChild(el('label',null,'Quiz in progress'));
  const name = p.savedQuizName ? escapeHtml(p.savedQuizName) : 'Unsaved quiz';
  card.appendChild(el('p',null, `<strong>${name}</strong><br><span class="hint">${answered} of ${total} question(s) answered</span>`));
  const btnRow = el('div','btn-row');
  btnRow.style.marginTop = '8px';
  const cont = el('button','btn btn-primary','Continue');
  cont.onclick = resumeProgress;
  const discard = el('button','btn btn-outline','Discard');
  discard.onclick = ()=>{
    if(confirm('Discard this in-progress quiz? This can\'t be undone.')){
      clearProgress();
      render();
    }
  };
  btnRow.appendChild(cont); btnRow.appendChild(discard);
  card.appendChild(btnRow);
  return card;
}


function render(){
  const root = document.getElementById('app');
  root.innerHTML = '';
  root.appendChild(buildHeader());
  if(AppState.phase === 'setup') root.appendChild(buildSetup());
  else if(AppState.phase === 'manual') root.appendChild(buildManual());
  else if(AppState.phase === 'quiz') root.appendChild(buildQuiz());
  else if(AppState.phase === 'reviewPrompt') root.appendChild(buildReviewPrompt());
  else if(AppState.phase === 'results') root.appendChild(buildResults());
}

function buildHeader(){
  const h = document.createElement('header');
  h.className = 'app-header';
  h.innerHTML = `<h1>Quiz Maker</h1><span class="tag">runs offline once loaded</span>`;
  return h;
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

/* ---------------- SETUP ---------------- */
function buildSetup(){
  const c = document.createElement('div');

  const resumeCard = buildResumeCard();
  if(resumeCard) c.appendChild(resumeCard);

  const card = el('div','card');

  const tabs = el('div','tabs');
  [['paste','Paste text'],['file','Upload .txt/.md'],['topic','Just a topic'],['ready','Paste ready-made quiz']].forEach(([key,label])=>{
    const b = el('button','tab-btn'+(AppState.setupTab===key?' active':''), label);
    b.onclick = ()=>{ AppState.setupTab = key; render(); };
    tabs.appendChild(b);
  });
  card.appendChild(tabs);

  if(AppState.setupTab === 'paste'){
    const f = el('div','field');
    f.appendChild(el('label',null,'Paste source text'));
    const ta = document.createElement('textarea');
    ta.placeholder = 'Paste notes, an article, a chapter, etc.';
    ta.value = AppState.pastedText;
    ta.oninput = e => AppState.pastedText = e.target.value;
    f.appendChild(ta);
    card.appendChild(f);
  } else if(AppState.setupTab === 'file'){
    const f = el('div','field');
    f.appendChild(el('label',null,'Upload a text file'));
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.txt,.md,.markdown';
    inp.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        AppState.fileText = ev.target.result;
        AppState.fileName = file.name;
        render();
      };
      reader.readAsText(file);
    };
    f.appendChild(inp);
    if(AppState.fileName){
      f.appendChild(el('div','hint', `Loaded: ${AppState.fileName} (${AppState.fileText.length} chars)`));
    }
    f.appendChild(el('div','hint','Plain text files only (.txt, .md). PDFs and Word docs aren\'t read in-browser — paste the text instead.'));
    card.appendChild(f);
  } else if(AppState.setupTab === 'ready'){
    const f = el('div','field');
    f.appendChild(el('label',null,'Paste a quiz that already has questions, options, and correct answers marked'));
    const ta = document.createElement('textarea');
    ta.placeholder = '1. Question?\nA. Option\nB. Option ✅\nC. Option\nD. Option';
    ta.style.minHeight = '160px';
    ta.value = AppState.readyText || '';
    ta.oninput = e => AppState.readyText = e.target.value;
    f.appendChild(ta);
    f.appendChild(el('div','hint','Works with numbered questions and A–D options where the correct one is marked with ✅, ✓, or "(correct)". No internet needed for this — it\'s just read directly, instantly.'));
    card.appendChild(f);
  } else {
    const f = el('div','field');
    f.appendChild(el('label',null,'Topic'));
    const inp = document.createElement('input');
    inp.type = 'text'; inp.placeholder = 'e.g. The French Revolution, JavaScript closures...';
    inp.value = AppState.topic;
    inp.oninput = e => AppState.topic = e.target.value;
    f.appendChild(inp);
    card.appendChild(f);
  }

  if(AppState.setupTab !== 'ready'){
    const row = el('div','row');
    const f1 = el('div','field');
    f1.appendChild(el('label',null,'Number of questions (3–30)'));
    const numInp = document.createElement('input');
    numInp.type = 'number'; numInp.min=3; numInp.max=30; numInp.value = AppState.numQuestions;
    numInp.oninput = e => AppState.numQuestions = Math.max(3, Math.min(30, parseInt(e.target.value)||6));
    f1.appendChild(numInp);
    row.appendChild(f1);
    card.appendChild(row);
  }

  const f2 = el('div','field');
  f2.appendChild(el('label',null,'Quiz mode'));
  const toggle = el('div','mode-toggle');
  const pBtn = el('button', AppState.mode==='practice'?'active':'', 'Practice — reveals each answer');
  const eBtn = el('button', AppState.mode==='exam'?'active':'', 'Exam — score at the end');
  pBtn.onclick = ()=>{ AppState.mode='practice'; render(); };
  eBtn.onclick = ()=>{ AppState.mode='exam'; render(); };
  toggle.appendChild(pBtn); toggle.appendChild(eBtn);
  f2.appendChild(toggle);
  card.appendChild(f2);

  if(AppState.error){
    card.appendChild(el('div','error-box', AppState.error));
  }

  if(AppState.setupTab === 'ready'){
    const importReadyBtn = el('button','btn btn-primary','Import quiz');
    importReadyBtn.onclick = ()=>{
      const parsed = parseFormattedQuiz(AppState.readyText || '');
      if(!parsed.length){
        AppState.error = 'Couldn\'t find any questions in that text. Make sure each question is numbered (1., 2., ...) and options are labeled A–D, with the correct one marked.';
        render();
        return;
      }
      AppState.error = '';
      AppState.questions = parsed;
      AppState.savedQuizId = null;
      AppState.savedQuizName = '';
      startQuiz();
    };
    card.appendChild(importReadyBtn);
    card.appendChild(el('div','hint','Runs instantly, fully offline — no AI call, so nothing to fail.'));
  } else {
    const genBtn = el('button','btn btn-primary', AppState.loading ? `<span class="spinner"></span>${AppState.loadingLabel || 'Generating…'}` : 'Generate quiz with AI');
    genBtn.disabled = AppState.loading;
    genBtn.onclick = generateQuiz;
    card.appendChild(genBtn);
    card.appendChild(el('div','hint','Needs an internet connection for this step. Once generated, taking the quiz works fully offline — no more network calls.'));
  }

  c.appendChild(card);

  // manual + import row
  const card2 = el('div','card');
  card2.appendChild(el('label',null,'No AI / fully offline'));
  const btnRow = el('div','btn-row');
  const manualBtn = el('button','btn btn-outline','Build quiz manually');
  manualBtn.onclick = ()=>{ AppState.phase='manual'; render(); };
  const importInp = document.createElement('input');
  importInp.type='file'; importInp.accept='.json'; importInp.style.display='none';
  importInp.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try{
        const data = JSON.parse(ev.target.result);
        if(Array.isArray(data) && data.length){
          AppState.questions = data;
          startQuiz();
        } else {
          AppState.error = 'That file doesn\'t look like a valid quiz export.';
          render();
        }
      }catch(err){
        AppState.error = 'Could not read that JSON file.';
        render();
      }
    };
    reader.readAsText(file);
  };
  const importBtn = el('button','btn btn-outline','Import saved quiz (.json)');
  importBtn.onclick = ()=> importInp.click();
  btnRow.appendChild(manualBtn); btnRow.appendChild(importBtn);
  card2.appendChild(btnRow);
  card2.appendChild(importInp);
  c.appendChild(card2);

  const savedCard = buildSavedQuizzes();
  if(savedCard) c.appendChild(savedCard);

  return c;
}

/* ---------------- READY-MADE QUIZ PARSER ---------------- */
function parseFormattedQuiz(raw){
  const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l.length);
  const qRe = /^(\d{1,3})[\.\)]\s*(.+)/;
  const optRe = /^([A-Da-d])[\.\)]\s*(.+)/;
  const markers = ['✅','✔️','✔','✓'];

  const questions = [];
  let current = null;

  function finalize(c){
    if(!c || !c.question || c.options.length < 2) return null;
    let correctIndex = c.options.findIndex(o => o.isCorrect);
    if(correctIndex === -1) correctIndex = 0;
    return { question: c.question, options: c.options.map(o => o.text), correctIndex, explanation: '' };
  }

  for(const line of lines){
    const optMatch = line.match(optRe);
    const qMatch = !optMatch ? line.match(qRe) : null;

    if(qMatch){
      const done = finalize(current);
      if(done) questions.push(done);
      current = { question: qMatch[2].trim(), options: [] };
      continue;
    }
    if(optMatch && current){
      let text = optMatch[2].trim();
      let isCorrect = false;
      for(const m of markers){
        if(text.includes(m)){ isCorrect = true; text = text.split(m)[0].trim(); }
      }
      if(/\(correct\)/i.test(text)){ isCorrect = true; text = text.replace(/\(correct\)/i,'').trim(); }
      if(text) current.options.push({ text, isCorrect });
    }
  }
  const done = finalize(current);
  if(done) questions.push(done);
  return questions;
}

async function generateQuiz(){
  AppState.error = '';
  let context = '';
  if(AppState.setupTab === 'paste') context = AppState.pastedText.trim();
  else if(AppState.setupTab === 'file') context = AppState.fileText.trim();
  else context = AppState.topic.trim();

  if(!context){
    AppState.error = 'Add some text, a file, or a topic first.';
    render();
    return;
  }

  AppState.loading = true;
  AppState.error = '';
  render();

  const n = AppState.numQuestions;
  const sourceLabel = AppState.setupTab === 'topic' ? 'topic' : 'source text';
  const BATCH_SIZE = 6; // keeps each AI response comfortably within its size limit
  const batches = [];
  let remaining = n;
  while(remaining > 0){
    batches.push(Math.min(BATCH_SIZE, remaining));
    remaining -= BATCH_SIZE;
  }

  const allQuestions = [];
  try{
    for(let b = 0; b < batches.length; b++){
      const count = batches[b];
      AppState.loadingLabel = batches.length > 1
        ? `Generating questions ${allQuestions.length+1}–${allQuestions.length+count} of ${n}…`
        : 'Generating…';
      render();

      // Keep the "avoid repeating" list short so it doesn't crowd out the prompt on later batches.
      const avoidList = allQuestions.slice(-12).map(q => q.question).join(' | ');
      const prompt = `You write multiple-choice quiz questions. Based on the following ${sourceLabel}, write exactly ${count} multiple-choice questions.
${avoidList ? `Do not repeat or closely rephrase these already-used questions: ${avoidList}` : ''}

Return ONLY a raw JSON array, no markdown fences, no commentary, no text before or after the array, in exactly this shape:
[{"question":"...","options":["...","...","...","..."],"correctIndex":0,"explanation":"one short sentence"}]

Rules:
- Exactly 4 options per question.
- correctIndex is the 0-based index of the correct option.
- Keep each question and option concise.
- explanation is a single short sentence justifying the correct answer.
- Base every question strictly on the ${sourceLabel} below.

${sourceLabel.toUpperCase()}:
"""
${context.slice(0, 6000)}
"""`;

      let batchQuestions = null;
      let lastErr = null;
      // Try up to 3 times per batch before giving up on it.
      for(let attempt = 0; attempt < 3 && !batchQuestions; attempt++){
        try{
          const response = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model: "claude-sonnet-4-6",
              max_tokens: 1000,
              messages: [{ role: "user", content: prompt }]
            })
          });
          if(!response.ok){
            throw new Error('HTTP ' + response.status);
          }
          const data = await response.json();
          const textBlock = (data.content || []).find(x => x.type === 'text');
          if(!textBlock) throw new Error('No text in response');
          let raw = textBlock.text.trim();
          raw = raw.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
          // If the model added any stray text around the array, pull out just the [ ... ] block.
          const match = raw.match(/\[[\s\S]*\]/);
          if(match) raw = match[0];
          const parsed = JSON.parse(raw);
          if(!Array.isArray(parsed) || !parsed.length) throw new Error('Empty batch');
          batchQuestions = parsed;
        }catch(e){
          lastErr = e;
          if(attempt < 2) await new Promise(r => setTimeout(r, 600));
        }
      }
      if(!batchQuestions){
        // This batch never came back clean. Keep whatever we already have and stop here
        // rather than throwing away earlier successful batches.
        if(allQuestions.length){
          break;
        } else {
          throw lastErr || new Error('Generation failed');
        }
      }
      allQuestions.push(...batchQuestions);
    }
    AppState.questions = allQuestions;
    AppState.loading = false;
    startQuiz();
  }catch(err){
    AppState.loading = false;
    if(allQuestions.length){
      AppState.questions = allQuestions;
      startQuiz();
    } else {
      AppState.error = 'Could not generate a quiz right now. Check your connection and try again, or build one manually below.';
      render();
    }
  }
}

/* ---------------- MANUAL BUILDER ---------------- */
function buildManual(){
  const c = document.createElement('div');
  const card = el('div','card');
  card.appendChild(el('label',null,'Question'));
  const qInp = document.createElement('textarea');
  qInp.value = AppState.manualDraft.question;
  qInp.style.minHeight = '60px';
  qInp.oninput = e => AppState.manualDraft.question = e.target.value;
  card.appendChild(qInp);

  AppState.manualDraft.options.forEach((opt,i)=>{
    const f = el('div','field');
    f.style.marginTop='10px';
    const lbl = el('label',null, 'Option '+String.fromCharCode(65+i) + (AppState.manualDraft.correctIndex===i ? ' — correct' : ''));
    f.appendChild(lbl);
    const row = el('div','row');
    const inp = document.createElement('input');
    inp.type='text'; inp.value = opt;
    inp.oninput = e => AppState.manualDraft.options[i] = e.target.value;
    row.appendChild(inp);
    const mark = el('button','btn btn-outline', AppState.manualDraft.correctIndex===i ? '✓' : 'Mark correct');
    mark.style.flex = '0 0 auto';
    mark.onclick = ()=>{ AppState.manualDraft.correctIndex = i; render(); };
    row.appendChild(mark);
    f.appendChild(row);
    card.appendChild(f);
  });

  const addBtn = el('button','btn btn-primary','Add question');
  addBtn.style.marginTop = '14px';
  addBtn.onclick = ()=>{
    const d = AppState.manualDraft;
    if(!d.question.trim() || d.options.some(o=>!o.trim())){
      AppState.error = 'Fill in the question and all four options.';
      render();
      return;
    }
    AppState.error = '';
    AppState.questions.push({question:d.question, options:[...d.options], correctIndex:d.correctIndex, explanation:''});
    AppState.manualDraft = {question:'', options:['','','',''], correctIndex:0};
    render();
  };
  card.appendChild(addBtn);
  if(AppState.error) card.appendChild(el('div','error-box',AppState.error));
  c.appendChild(card);

  if(AppState.questions.length){
    const card2 = el('div','card');
    card2.appendChild(el('label',null, AppState.questions.length + ' question(s) added'));
    const list = el('div','manual-list');
    AppState.questions.forEach((q,i)=>{
      const item = el('div','manual-q');
      const span = el('span',null, (i+1)+'. '+q.question);
      const del = document.createElement('button');
      del.textContent = 'Remove';
      del.onclick = ()=>{ AppState.questions.splice(i,1); render(); };
      item.appendChild(span); item.appendChild(del);
      list.appendChild(item);
    });
    card2.appendChild(list);

    const actionRow = el('div');
    actionRow.style.display = 'flex';
    actionRow.style.gap = '10px';
    actionRow.style.marginTop = '10px';

    const saveReadyBtn = el(
      'button',
      'btn btn-outline',
      AppState.savedQuizId ? '✓ Saved offline' : '💾 Save quiz offline'
    );
    saveReadyBtn.style.flex = '1';
    saveReadyBtn.onclick = saveCurrentQuiz;

    const startBtn = el('button','btn btn-amber','Start quiz');
    startBtn.style.flex = '1';
    startBtn.onclick = startQuiz;

    actionRow.appendChild(saveReadyBtn);
    actionRow.appendChild(startBtn);
    card2.appendChild(actionRow);
    c.appendChild(card2);
  }

  const back = el('button','link-btn','← back to setup');
  back.style.marginTop = '4px';
  back.onclick = ()=>{ AppState.phase='setup'; render(); };
  c.appendChild(back);

  return c;
}

/* ---------------- QUIZ ---------------- */
function startQuiz(){
  clearProgress();
  AppState.phase = 'quiz';
  AppState.current = 0;
  AppState.selected = {};
  AppState.confirmed = {};
  AppState.score = 0;
  render();
}

function buildQuiz(){
  saveProgress();

  const c = document.createElement('div');
  const total = AppState.questions.length;
  const i = AppState.current;
  const q = AppState.questions[i];

  const quizModeLabel = AppState.mode==='exam' ? 'Exam mode' : 'Practice mode';
  const savedLabel = AppState.savedQuizId ? ' · Saved offline' : '';
  const prog = el('div','progress-line', `<span>Question ${i+1} of ${total}</span><span>${quizModeLabel}${savedLabel}</span>`);
  c.appendChild(prog);
  const track = el('div','progress-track');
  const fill = el('div','progress-fill');
  fill.style.width = ((i)/total*100)+'%';
  track.appendChild(fill);
  c.appendChild(track);

  // question navigator — jump to any question, answered or not
  const qnav = el('div','qnav');
  AppState.questions.forEach((_, idx) => {
    const done = !!AppState.confirmed[idx];
    const isCurrent = idx === i;
    const item = el('div', 'qnav-item' + (done?' done':'') + (isCurrent?' current':''), String(idx+1));
    item.onclick = ()=>{ AppState.current = idx; render(); };
    qnav.appendChild(item);
  });
  c.appendChild(qnav);

  const card = el('div','card');

  const topActions = el('div','top-actions');
  const restartLink = el('button','link-btn','Restart quiz');
  restartLink.onclick = ()=>{
    if(confirm('Restart from question 1? Your current answers will be cleared.')){
      startQuiz();
    }
  };
  const saveBtn = el('button','btn btn-outline',
    AppState.savedQuizId ? '✓ Saved offline' : '💾 Save quiz offline');
  saveBtn.onclick = saveCurrentQuiz;
  topActions.appendChild(restartLink);
  topActions.appendChild(saveBtn);
  card.appendChild(topActions);

  card.appendChild(el('div','q-number','Q'+(i+1)));
  card.appendChild(el('p','q-text', q.question));

  const isConfirmed = !!AppState.confirmed[i];
  const chosen = AppState.selected[i];
  const revealNow = AppState.mode === 'practice' && isConfirmed;

  q.options.forEach((opt, oi)=>{
    const optEl = el('div','option');
    if(chosen === oi) optEl.classList.add('selected');
    if(isConfirmed) optEl.classList.add('locked');
    if(revealNow){
      if(oi === q.correctIndex) optEl.classList.add('correct');
      else if(oi === chosen) optEl.classList.add('incorrect');
    }
    optEl.innerHTML = `<div class="bubble"></div><div class="option-text">${opt}</div>`;
    if(!isConfirmed){
      optEl.onclick = ()=>{ AppState.selected[i] = oi; render(); };
    }
    card.appendChild(optEl);
  });

  if(revealNow){
    const wasRight = chosen === q.correctIndex;
    const fb = el('div', 'feedback ' + (wasRight?'ok':'no'), wasRight ? 'CORRECT' : 'INCORRECT — correct answer highlighted above');
    card.appendChild(fb);
    if(q.explanation) card.appendChild(el('div','explanation', q.explanation));
  }

  const btnRow = el('div','btn-row');
  if(!isConfirmed){
    const skipBtn = el('button','btn btn-outline','Skip for now');
    skipBtn.onclick = ()=>{
      if(i < total-1){
        AppState.current++;
      } else {
        const firstUnanswered = AppState.questions.findIndex((_, idx) => !AppState.confirmed[idx]);
        if(firstUnanswered !== -1) AppState.current = firstUnanswered;
      }
      render();
    };
    const confirmBtn = el('button','btn btn-primary','Confirm answer');
    confirmBtn.disabled = chosen === undefined;
    confirmBtn.onclick = ()=>{
      if(chosen === undefined) return;
      AppState.confirmed[i] = true;
      if(chosen === q.correctIndex) AppState.score++;
      if(AppState.mode === 'exam'){
        goNext();
      } else {
        render();
      }
    };
    btnRow.appendChild(skipBtn);
    btnRow.appendChild(confirmBtn);
  } else if(AppState.mode === 'practice'){
    const nextBtn = el('button','btn btn-primary', i === total-1 ? 'See results' : 'Next question');
    nextBtn.onclick = goNext;
    btnRow.appendChild(nextBtn);
  } else {
    const nextBtn = el('button','btn btn-primary', i === total-1 ? 'Finish exam' : 'Next question');
    nextBtn.onclick = goNext;
    btnRow.appendChild(nextBtn);
  }
  card.appendChild(btnRow);

  const finishLink = el('button','link-btn finish-link','Finish now & see results');
  finishLink.onclick = attemptFinish;
  card.appendChild(finishLink);

  c.appendChild(card);
  return c;
}

function goNext(){
  if(AppState.current < AppState.questions.length - 1){
    AppState.current++;
    render();
  } else {
    attemptFinish();
  }
}

function attemptFinish(){
  const unanswered = [];
  AppState.questions.forEach((_, idx) => { if(!AppState.confirmed[idx]) unanswered.push(idx); });
  if(unanswered.length === 0){
    clearProgress();
    AppState.phase = 'results';
    render();
  } else {
    AppState.unansweredList = unanswered;
    AppState.phase = 'reviewPrompt';
    render();
  }
}

function buildReviewPrompt(){
  const c = document.createElement('div');
  const card = el('div','card center');
  const n = AppState.unansweredList.length;
  card.appendChild(el('label',null, `${n} question${n===1?'':'s'} still unanswered`));
  card.appendChild(el('p',null, 'You can go back and answer them, or submit as-is — unanswered questions will count as incorrect.'));
  const btnRow = el('div','btn-row');
  btnRow.style.marginTop = '10px';
  const reviewBtn = el('button','btn btn-primary','Review unanswered');
  reviewBtn.onclick = ()=>{
    AppState.current = AppState.unansweredList[0];
    AppState.phase = 'quiz';
    render();
  };
  const submitBtn = el('button','btn btn-outline','Submit anyway');
  submitBtn.onclick = ()=>{
    clearProgress();
    AppState.phase = 'results';
    render();
  };
  btnRow.appendChild(reviewBtn); btnRow.appendChild(submitBtn);
  card.appendChild(btnRow);
  c.appendChild(card);
  return c;
}

/* ---------------- RESULTS ---------------- */
function buildResults(){
  clearProgress();
  const c = document.createElement('div');
  const total = AppState.questions.length;
  const score = AppState.score;
  const pct = Math.round(score/total*100);
  const pass = pct >= 60;

  const card = el('div','card center');
  card.appendChild(el('div','stamp'+(pass?' pass':''), pass ? 'PASS' : 'REVIEW'));
  const scoreLine = el('p',null, `<strong style="font-size:1.3rem;">${score} / ${total}</strong>`);
  card.appendChild(scoreLine);
  card.appendChild(el('div','score-sub', pct+'%'));

  const btnRow = el('div','btn-row');
  btnRow.style.marginTop = '16px';
  const retake = el('button','btn btn-primary','Retake this quiz');
  retake.onclick = startQuiz;
  const newQuiz = el('button','btn btn-outline','New quiz');
  newQuiz.onclick = ()=>{
    AppState.phase='setup'; AppState.questions=[]; AppState.error='';
    AppState.savedQuizId=null; AppState.savedQuizName='';
    AppState.pastedText=''; AppState.fileText=''; AppState.fileName=''; AppState.topic=''; AppState.readyText='';
    render();
  };
  btnRow.appendChild(retake); btnRow.appendChild(newQuiz);
  card.appendChild(btnRow);

  const exportBtn = el('button','link-btn','Save this quiz as a file (.json) to reuse offline later');
  exportBtn.style.marginTop='12px';
  exportBtn.onclick = ()=>{
    const blob = new Blob([JSON.stringify(AppState.questions, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'quiz.json'; a.click();
    URL.revokeObjectURL(url);
  };
  card.appendChild(document.createElement('br'));
  card.appendChild(exportBtn);
  c.appendChild(card);

  const reviewCard = el('div','card');
  reviewCard.appendChild(el('label',null,'Review'));
  AppState.questions.forEach((q,i)=>{
    const item = el('div','review-item');
    item.appendChild(el('p','review-q', (i+1)+'. '+q.question));
    const chosen = AppState.selected[i];
    const isConfirmed = !!AppState.confirmed[i];
    const wasRight = isConfirmed && chosen === q.correctIndex;
    if(!isConfirmed){
      item.appendChild(el('p','review-ans skipped','You didn\'t answer this one'));
      item.appendChild(el('p','review-ans correct-line','Correct answer: '+q.options[q.correctIndex]));
    } else {
      item.appendChild(el('p','review-ans '+(wasRight?'you-right':'you-wrong'), 'Your answer: '+q.options[chosen]));
      if(!wasRight){
        item.appendChild(el('p','review-ans correct-line','Correct answer: '+q.options[q.correctIndex]));
      }
    }
    if(q.explanation) item.appendChild(el('p','explanation', q.explanation));
    reviewCard.appendChild(item);
  });
  c.appendChild(reviewCard);

  return c;
}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
